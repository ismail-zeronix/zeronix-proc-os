<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f9d58" />
    <meta name="robots" content="noindex" />
    <title>You are offline · Zeronix Tech</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fff; color: #1d2330; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; display: grid; gap: 12px; justify-items: center; }
      .mark { width: 56px; height: 56px; border-radius: 14px; }
      h1 { margin: 8px 0 0; font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: #666e7a; }
      button { margin-top: 8px; height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #0a8443; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Check your connection and try again. Prices and stock need a live connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
